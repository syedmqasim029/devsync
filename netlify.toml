# ==============================================================================
# DevSync — Netlify Production Configuration (Frontend CDN + Edge API Proxy)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 1. Proxy all /api/* requests at the Netlify Edge to the Render Express Backend
[[redirects]]
  from = "/api/*"
  to = "https://devsync-api-ibk2.onrender.com/api/:splat"
  status = 200
  force = true

# 2. Proxy GitHub OAuth 2.0 callback requests to the Render Express Backend
[[redirects]]
  from = "/auth/callback*"
  to = "https://devsync-api-ibk2.onrender.com/auth/callback:splat"
  status = 200
  force = true

# 3. SPA Catch-All Fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200